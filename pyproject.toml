[project]
name = "linfo"
version = "0.1.0"
description = "linfo - Linux distro info CLI with fastfetch-style output and LLM details"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.14"
dependencies = [
    "ddgs>=7.0.0",
    "python-dotenv>=1.0.0",
    "duckduckgo-search>=8.1.1",
    "langchain>=1.2.6",
    "langchain-community>=0.4.1",
    "langchain-openai>=0.2.0",
    "langchain-groq>=1.1.1",
    "rich>=13.9.0",
    "wikipedia>=1.4.0",
]

[project.scripts]
linfo = "linfo.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/linfo"]
