[project]
name = "linfo"
version = "0.5.0"
description = "linfo - Linux distro info CLI with fastfetch-style output and LLM details"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Roy Jensen", email = "g04t@t3chg04t.wtf" }
]
requires-python = ">=3.14"
dependencies = [
    "ddgs>=7.0.0",
    "python-dotenv>=1.0.0",
    "duckduckgo-search>=8.1.1",
    "langchain>=1.2.6",
    "langchain-community>=0.4.1",
    "langchain-openai>=0.2.0",
    "langchain-groq>=1.1.1",
    "rich>=13.9.0",
    "wikipedia>=1.4.0",
]

[project.scripts]
linfo = "linfo.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/linfo"]

[tool.hatch.build]
# Include the logs directory placeholder for source distributions, but exclude runtime log files
include = [
    "src/linfo",
    "logs/.gitkeep",
]
exclude = [
    "logs/*.txt",
    "logs/*.json",
    "logs/*",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.25.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
